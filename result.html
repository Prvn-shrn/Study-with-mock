<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Result – MockTest Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Mukta:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>

<body>
    <div class="phone-frame result-page">

        <!-- ===== SCROLLABLE RESULT AREA ===== -->
        <div class="result-scroll">

            <!-- This div is captured for screenshot -->
            <div id="resultCapture" class="result-capture">

                <!-- Result Header -->
                <div class="res-header">
                    <div class="tricolor-bar">
                        <span class="tc saffron"></span>
                        <span class="tc white"></span>
                        <span class="tc green"></span>
                    </div>
                    <p class="res-logo">📚 MockTest Pro</p>
                    <h2 class="res-name" id="resName">–</h2>
                    <p class="res-sec" id="resSec">Chapter 1 – Samanya Gyan</p>
                    <div class="tricolor-bar">
                        <span class="tc saffron"></span>
                        <span class="tc white"></span>
                        <span class="tc green"></span>
                    </div>
                </div>

                <!-- Score Card -->
                <div class="score-card">
                    <div class="score-circle" id="scoreCircle">
                        <span class="sc-num" id="scNum">0/20</span>
                        <span class="sc-pct" id="scPct">0%</span>
                    </div>
                    <div class="score-stats">
                        <div class="stat stat-correct">
                            <span class="st-icon">✅</span>
                            <span class="st-val" id="cntCorrect">0</span>
                            <span class="st-lbl">Sahi</span>
                        </div>
                        <div class="stat stat-divider">|</div>
                        <div class="stat stat-wrong">
                            <span class="st-icon">❌</span>
                            <span class="st-val" id="cntWrong">0</span>
                            <span class="st-lbl">Galat</span>
                        </div>
                        <div class="stat stat-divider">|</div>
                        <div class="stat stat-skip">
                            <span class="st-icon">⏭</span>
                            <span class="st-val" id="cntSkip">0</span>
                            <span class="st-lbl">Skip</span>
                        </div>
                    </div>
                    <!-- Performance Badge -->
                    <div class="perf-badge" id="perfBadge">–</div>
                </div>

                <!-- Detailed Review -->
                <div class="review-wrap">
                    <h3 class="review-ttl">
                        <span class="rtl-line"></span>
                        📋 Detailed Review
                        <span class="rtl-line"></span>
                    </h3>
                    <div id="reviewList">
                        <!-- Dynamically filled by result.js -->
                    </div>
                </div>

            </div><!-- end #resultCapture -->
        </div><!-- end .result-scroll -->

        <!-- ===== ACTION BUTTONS ===== -->
        <div class="res-actions">
            <button class="btn-primary" onclick="takeScreenshot()">📸 Screenshot Le</button>
            <button class="btn-secondary" onclick="goHome()">🏠 Wapas Jaayein</button>
        </div>

        <!-- ===== SOCIAL BAR ===== -->
        <footer class="social-bar">
            <a id="igLink" href="#" target="_blank" class="soc-btn ig" title="Instagram">
                <svg viewBox="0 0 24 24" fill="white" width="22" height="22">
                    <path
                        d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                </svg>
            </a>
            <span class="soc-label">Follow Us</span>
            <a id="ytLink" href="#" target="_blank" class="soc-btn yt" title="YouTube">
                <svg viewBox="0 0 24 24" fill="white" width="22" height="22">
                    <path
                        d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z" />
                </svg>
            </a>
        </footer>

    </div>

    <script src="config.js"></script>
    <script src="data1.js"></script>
    <script src="data2.js"></script>
    <script src="data3.js"></script>
    <script src="result.js"></script>
</body>

</html>
